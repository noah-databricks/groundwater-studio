# Groundwater Studio (MODFLOW OS) as a Declarative Automation Bundle.
# Deploy with ./install.sh, which creates the Unity Catalog objects first and writes resources/app.yml
# (the app and the workspace-specific parts it depends on: Lakebase, served models).
bundle:
  name: groundwater-studio

# one deployment state per app name, so several installs can share a workspace
workspace:
  root_path: ~/.bundle/${bundle.name}/${var.app_name}

include:
  - resources/*.yml

sync:
  exclude:
    - engines
    - data
    - examples
    - installer
    - ui/node_modules
    - .install

variables:
  catalog:
    description: Unity Catalog catalog that holds the schema
  schema:
    description: Schema for the model inputs, run records and volumes
    default: groundwater_studio
  warehouse_id:
    description: SQL warehouse the app, jobs and the agent's Python sandbox use
  app_name:
    description: Name of the Databricks App (and prefix of its jobs)
    default: groundwater-studio
  lakebase_project:
    description: Lakebase project for agent threads and the Operations sheet (empty for none)
    default: ""

resources:
  jobs:
    modflow_ensemble:
      name: ${var.app_name}-ensemble
      description: Monte Carlo MODFLOW 6 ensemble fanned out across Spark tasks (triggered from Groundwater Studio)
      max_concurrent_runs: 5
      parameters:
        - {name: ensemble_id, default: manual-test}
        - {name: n, default: "64"}
        - {name: config_json, default: "{}"}
        - {name: run_by, default: ""}
        - {name: label, default: ""}
      tasks:
        - task_key: ensemble
          environment_key: modflow
          spark_python_task:
            python_file: ./src/ensemble_job.py
            parameters:
              - --ensemble_id={{job.parameters.ensemble_id}}
              - --n={{job.parameters.n}}
              - --config_json={{job.parameters.config_json}}
              - --run_by={{job.parameters.run_by}}
              - --label={{job.parameters.label}}
              - --job_run_id={{job.run_id}}
              - --catalog=${var.catalog}
              - --schema=${var.schema}
              - --experiment=${resources.experiments.studio.name}
      environments:
        - environment_key: modflow
          spec:
            environment_version: "4"
            dependencies:
              - flopy==3.11.0

    modflow_scenario:
      name: ${var.app_name}-scenario-run
      description: "MODFLOW OS as a job step: resolve a scenario spec, run MODFLOW 6 on serverless as the job identity, file it to Delta + MLflow, publish the result as task values"
      max_concurrent_runs: 20
      parameters:
        - {name: scenario, default: "{}"}
        - {name: label, default: ""}
        - {name: study_id, default: ""}
      tasks:
        - task_key: modflow
          environment_key: modflow_os
          spark_python_task:
            python_file: ./jobs/modflow_task.py
            parameters:
              - --app_dir=${workspace.file_path}/app
              - --scenario={{job.parameters.scenario}}
              - --label={{job.parameters.label}}
              - --study_id={{job.parameters.study_id}}
              - --job_run_id={{job.run_id}}
              - --catalog=${var.catalog}
              - --schema=${var.schema}
              - --warehouse_id=${var.warehouse_id}
              - --experiment_id=${resources.experiments.studio.id}
      environments:
        - environment_key: modflow_os
          spec:
            environment_version: "4"
            dependencies:
              - flopy==3.11.0
              - databricks-sdk>=0.60
              - mlflow-skinny>=3.1
              - fastapi
              - python-multipart
              - "mcp>=1.28,<2"
              - httpx
              - pyyaml

    modflow_agent:
      name: ${var.app_name}-agent-step
      description: "A MODFLOW OS research agent as a job step: runs a prompt through Omnigent on a Databricks Sandbox (harness + Unity AI Gateway model of your choice) as the job's run-as identity, publishes the answer as task values. Set run_as to a service principal for unattended use."
      max_concurrent_runs: 10
      parameters:
        - {name: prompt, default: "Describe the model and summarise the baseline in three sentences."}
        - {name: harness, default: claude-sdk}
        - {name: model, default: ""}
        - {name: mode, default: auto}
        - {name: study_id, default: ""}
      tasks:
        - task_key: agent
          environment_key: agent
          spark_python_task:
            python_file: ./jobs/agent_task.py
            parameters:
              - --app_dir=${workspace.file_path}/app
              - --app_name=${var.app_name}
              - --prompt={{job.parameters.prompt}}
              - --harness={{job.parameters.harness}}
              - --model={{job.parameters.model}}
              - --mode={{job.parameters.mode}}
              - --study_id={{job.parameters.study_id}}
      environments:
        - environment_key: agent
          spec:
            environment_version: "4"
            dependencies:
              - databricks-sdk>=0.60
              - fastapi
              - httpx
              - pyyaml

    ops_sync:
      name: ${var.app_name}-ops-sync
      description: "Refresh the Lakebase copies of the seasonal outlook (synced tables) and grant the app read access to them"
      max_concurrent_runs: 1
      tasks:
        - task_key: sync
          environment_key: ops
          spark_python_task:
            python_file: ./jobs/ops_sync.py
            parameters:
              - --catalog=${var.catalog}
              - --schema=${var.schema}
              - --app_name=${var.app_name}
              - --project=${var.lakebase_project}
      environments:
        - environment_key: ops
          spec:
            environment_version: "4"
            dependencies:
              - databricks-sdk>=0.81
              - psycopg[binary]>=3.2

    outlook:
      name: ${var.app_name}-seasonal-outlook
      description: "When new telemetry lands: ingest it, re-run the district for a dry, an average and a wet year, publish the outlook to Lakebase for operations, and have the MODFLOW agent write the briefing"
      max_concurrent_runs: 1
      trigger:
        pause_status: UNPAUSED
        file_arrival:
          url: /Volumes/${var.catalog}/${var.schema}/landing/telemetry/
          min_time_between_triggers_seconds: 300
          wait_after_last_change_seconds: 60
      tasks:
        - task_key: ingest
          pipeline_task:
            pipeline_id: ${resources.pipelines.district_ingest.id}
        - task_key: dry_year
          depends_on: [{task_key: ingest}]
          run_job_task:
            job_id: ${resources.jobs.modflow_scenario.id}
            job_parameters:
              scenario: '{"set": {"rain_mult": 0.7, "et_mult": 1.15, "pumping_mult": 1.4, "deep_drainage_frac": 0.09}}'
              label: "Outlook: dry year (low allocation, more pumping)"
        - task_key: average_year
          depends_on: [{task_key: ingest}]
          run_job_task:
            job_id: ${resources.jobs.modflow_scenario.id}
            job_parameters:
              scenario: "{}"
              label: "Outlook: average year"
        - task_key: wet_year
          depends_on: [{task_key: ingest}]
          run_job_task:
            job_id: ${resources.jobs.modflow_scenario.id}
            job_parameters:
              scenario: '{"set": {"rain_mult": 1.3, "et_mult": 0.9, "pumping_mult": 0.6, "deep_drainage_frac": 0.15}}'
              label: "Outlook: wet year (full allocation, less pumping)"
        - task_key: publish
          depends_on: [{task_key: dry_year}, {task_key: average_year}, {task_key: wet_year}]
          pipeline_task:
            pipeline_id: ${resources.pipelines.district_ingest.id}
        - task_key: lakebase_sync
          depends_on: [{task_key: publish}]
          run_job_task:
            job_id: ${resources.jobs.ops_sync.id}
        - task_key: briefing
          depends_on: [{task_key: dry_year}, {task_key: average_year}, {task_key: wet_year}]
          run_job_task:
            job_id: ${resources.jobs.modflow_agent.id}
            job_parameters:
              mode: auto
              prompt: >-
                New telemetry has landed and the outlook job has just filed three runs: 'Outlook: dry year (low allocation,
                more pumping)', 'Outlook: average year' and 'Outlook: wet year (full allocation, less pumping)'. Open a study
                called 'Seasonal outlook {{job.start_time.iso_date}}'. First ask Genie which monitoring bores were most at
                risk in the previous outlook. Then compare the three new runs against the calibrated baseline (area within
                2 m of the surface, worst month, channel seepage, the monitoring bores most at risk), record two or three
                findings that cite the runs (quote Genie's SQL in any finding that relies on it), conclude the study, and
                write a one-page PDF briefing for the operations team with one figure. Keep tool calls short.

  pipelines:
    district_ingest:
      name: ${var.app_name}-district-ingest
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      channel: CURRENT
      libraries:
        - file:
            path: ./pipelines/district_ingest.sql
      configuration:
        landing: /Volumes/${var.catalog}/${var.schema}/landing
        fq: "`${var.catalog}`.`${var.schema}`"
        mask_fn: "`${var.catalog}`.`${var.schema}`.mask_restricted"

  experiments:
    studio:
      name: /Users/${workspace.current_user.userName}/${var.app_name}

targets:
  default:
    default: true

[project]
name = "groundwater-studio"
version = "1.0.0"
description = "Groundwater Studio / MODFLOW OS: MODFLOW 6 on Unity Catalog data, with an embedded Omnigent agent"
requires-python = ">=3.12,<3.13"
dependencies = [
  "flopy==3.11.0",
  "databricks-sdk>=0.60",
  "mlflow-skinny>=3.1",
  "pandas",
  "numpy",
  "python-multipart",
  "fastapi",
  "uvicorn[standard]",
  "mcp>=1.28,<2",
  "pyyaml",
  "httpx",
  "omnigent[databricks]==0.16.0.dev0",
  "omnigent-client==0.16.0.dev0",
  "omnigent-ui-sdk==0.16.0.dev0",
  "claude-agent-sdk==0.2.94",
]

[tool.uv]
package = false

[tool.uv.sources]
omnigent = { path = "wheels/omnigent-0.16.0.dev0-py3-none-any.whl" }
omnigent-client = { path = "wheels/omnigent_client-0.16.0.dev0-py3-none-any.whl" }
omnigent-ui-sdk = { path = "wheels/omnigent_ui_sdk-0.16.0.dev0-py3-none-any.whl" }
